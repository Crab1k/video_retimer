<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="version" content="1.3" />
	<meta name="description"
		content="Frame-accurate speedrun retiming for YouTube, Twitch, Bilibili, Niconico, and Google Drive.">
	<meta name="theme-color" content="#000000" />
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="shortcut icon" href="icon.png">
	<link rel="apple-touch-icon" href="icon.png">

	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9471770752118519"
		crossorigin="anonymous"></script>
	<title>Video Retimer+</title>
	<link rel="stylesheet" href="modes.css">
	<style>
		body {
			margin: 0;
			min-height: 100vh;
		}

		.home-top {
			display: flex;
			justify-content: flex-end;
			align-items: center;
			gap: 8px;
			padding: 12px 16px;
		}

		.home-main {
			display: flex;
			justify-content: center;
			padding: 10vh 16px 32px;
		}

		.home-card {
			width: min(640px, 100%);
			text-align: center;
		}

		#better-speedrun-timer {
			font-size: clamp(2rem, 6vw, 3.2rem);
			margin: 0 0 8px;
			white-space: normal;
		}

		#homesub {
			margin: 0 0 28px;
			line-height: 1.4;
			opacity: 0.75;
		}

		.home-row {
			display: flex;
			gap: 8px;
		}

		#url {
			flex: 1;
			width: 100%;
			height: auto;
			min-height: 20px;
			box-sizing: border-box;
		}

		.home-terms {
			margin: 8px 0 0;
			font-size: 12px;
			line-height: 1.4;
		}

		.home-terms a {
			color: inherit;
			opacity: 0.5;
			text-decoration: underline;
		}

		.home-terms a:hover {
			opacity: 0.85;
		}

		.home-meta {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			min-height: 2.2em;
			margin-top: 10px;
			text-align: left;
		}

		#platform-chip {
			display: none;
			padding: 3px 10px;
			border-radius: 999px;
			font-size: 14px;
			font-weight: 500;
			line-height: 1.6;
		}

		[theme="light"] #platform-chip {
			background-color: rgb(216, 216, 216);
		}

		[theme="dark"] #platform-chip {
			background-color: rgb(31, 31, 44);
		}

		#platform-chip.visible {
			display: inline-block;
		}

		#urlerror {
			display: none;
			margin: 0;
			color: #c62828;
		}

		[theme="dark"] #urlerror {
			color: #ff8a80;
		}

		#urlerror.visible {
			display: block;
		}

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		@media (max-width: 700px) {
			.home-main {
				padding-top: 6vh;
			}

			.home-row {
				flex-direction: column;
			}
		}
	</style>
	<script src="settheme.js"></script>
	<script src="index.js" defer></script>
	<script src="translation.js" defer></script>
</head>

<body>
	<div class="home-top">
		<button type="button" onclick="window.location.href = '/settings.html'" id="settingsbutton">Settings</button>
		<select id="langselect" aria-label="Language">
			<option value="EN" selected>English</option>
			<option value="PT">Português</option>
			<option value="IT">Italiano</option>
			<option value="FR">Français</option>
			<option value="ES">Español</option>
			<option value="DE">Deutsch</option>
			<option value="RU">Русский</option>
			<option value="UA">Українська</option>
		</select>
	</div>
	<main class="home-main">
		<div class="home-card">
			<h2 id="better-speedrun-timer">Video Retimer+</h2>
			<p id="homesub">Frame-accurate retiming for YouTube, Twitch, Bilibili, Niconico, and Drive.</p>
			<form id="load-form">
				<label for="url" id="urllabel" class="visually-hidden">YouTube/Twitch/Bilibili/Niconico Video URL:</label>
				<div class="home-row">
					<input id="url" type="text" autocomplete="off" spellcheck="false"
						placeholder="https://www.youtube.com/watch?v=…">
					<button type="submit" id="loadbutton">Load</button>
				</div>
			</form>
			<p class="home-terms">
				<a href="/terms.html" id="termslink">Terms of Use</a>
			</p>
			<div class="home-meta">
				<span id="platform-chip"></span>
				<p id="urlerror">Couldn't recognize this link.</p>
			</div>
		</div>
	</main>
</body>

</html>
